services:
 frontend:
 build:
 context: .
 target: frontend

 ports: "8080:8080"

 depends_on:
 backend:
 condition: service_healthy

 networks: 
 - quitanda

environment:
 POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/bkt_quitanda.sql:/docker-entrypoint-initdb.d/bkt_quitanda.sql:ro



